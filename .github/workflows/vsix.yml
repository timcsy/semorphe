# **擴充的 vsix：每次推送都打包，打 tag 才發佈。**
#
# 🔴 **為什麼發佈綁 tag，不綁每次推送**
#
# ```
# 版本號必須唯一且遞增   每次推送都發 ＝ 每個 WIP commit 都變成一個公開版本
# 使用者端會收到更新     一天推六次 ＝ 使用者一天被打擾六次
# 撤回很難              Marketplace 不能刪版本，只能再發一個更新的
# ```
#
# > **打 tag 是「我認為這一版可以給人用」的那個明確動作
# > ——與這個專案對「明確的動作」的一貫判準一致。**
#
# ⚠️ 而**打包**要每次都跑：`ship-extension` 那支 skill 逐字記著
# 「建置腳本裡的錯誤**可能不會讓指令失敗**」——打不出來要當天就知道，
# 不是等到要發佈的那一刻。
name: Extension (vsix)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # 🔴 **`npm ci` 要能重試**（2026-09-14）。
      #
      #    那天 `e2e (3)` 紅，而**它不是測試紅**：
      #
      #    ```
      #    npm error command failed
      #    npm error Download failed
      #    ```
      #
      #    那一片根本沒跑到測試，而後果是 `promote` 跳過、**主線沒換版**
      #    ——一次登錄庫的抖動，讓一份已經驗過的東西上不了線。
      #
      # > **一條會因為外面的網路抖一下就整輪作廢的流程，
      # > 它量的不是你的程式碼，是那一分鐘的運氣。**
      #
      #    ⚠️ 而它**只在片數變多之後才變得明顯**：四片各裝一次，
      #    撞到的機率是原本的四倍。
      # 🔴 **`--ignore-scripts` ＋ 只重建要用的**（2026-11-09）：同 deploy.yml 的 356——`tree-sitter-cli` 的安裝腳本從 GitHub releases 下載，
      #    504 時連三次都紅（3982fe4b 那一輪）。打包要跑腳本的只有 esbuild 與 @vscode/vsce-sign；
      #    keytar 是 optional、只有發佈存憑證才用。驗證：乾淨的 node_modules 用這一行裝，`npm run build:vscode` 過（45 檔、8.13 MB）。
      - name: npm ci（抖了就重試）
        run: |
          for i in 1 2 3; do
            npm ci --ignore-scripts --fetch-retries 5 --fetch-retry-maxtimeout 120000 && npm rebuild esbuild @vscode/vsce-sign && exit 0
            echo "::warning::npm ci 第 ${i} 次失敗，20 秒後重試"
            sleep 20
          done
          echo "::error::npm ci 連三次都失敗——這一次多半不是抖動"
          exit 1
      - run: npm run build:vscode

      # 🔴 **預檢——而它是 2026-08-31 那次資料遺失之後才接上 CI 的。**
      #
      # 使用者：「我用 Arduino IDE 把 semorphe 開起來，原本的 `setup` 和 `loop`
      # 會被 C++ 預設骨架覆蓋」。而 `tools/vscode-preflight` **早就有那條檢查**
      #（「開 .ino 面板：檔案一個字都沒改」），它也**在 ok 的閘裡**——
      # `ship-extension` 那把刀的第 3 步就是跑它。
      #
      # ⚠️ **而發 v0.11.2 的時候沒有人跑它。**
      #
      # > **一把寫好的刀，如果只靠「記得拿起來」，
      # > 那它擋住的缺陷數就等於「記得的次數」。**
      #
      # 🔴 而它同時暴露了那支檢查自己的盲點：假宿主的 URI 寫死 `probe.cpp`，
      #    於是那段自稱「開 .ino 面板」的檢查，測的是一個 `.cpp` 檔
      #    ——`.ino → arduino` 那條路一次都沒走過。兩件事同日修。
      - name: 安裝瀏覽器（預檢要用）
        # 2026-11-06：這一步在 runner 上掛了 5 小時（平常幾分鐘）——沒有上限時要等到工作的 6 小時預設逾時才會被砍
        # 2026-11-07：而只設 10 分鐘上限，GitHub 的 apt 鏡像慢的時候（一個字型包下載好幾分鐘）就被誤殺，連紅兩次。
        #   ⟹ 單次 9 分鐘、失敗重試一次，整步 20 分鐘——掛住的照樣砍得掉，慢一次的鏡像也容得下
        timeout-minutes: 20
        run: |
          for i in 1 2; do
            timeout 540 npx playwright install --with-deps chromium && exit 0
            echo "::warning::安裝瀏覽器第 $i 次沒完成（多半是 apt 鏡像慢），重試"
          done
          # 2026-11-12：apt 鏡像的 DNS 掛了一個多小時（Temporary failure resolving 'azure.archive.ubuntu.com'），連三輪紅、部署卡住。
          #   ⟹ 系統套件裝不了時，只裝瀏覽器本體（不碰 apt）：託管 runner 的映像本來就帶大部分函式庫；
          #   真的缺的話，下一步的測試會自己紅——不是把問題藏起來。
          echo "::warning::系統套件裝不了，改成只裝 chromium 本體（不經 apt）"
          timeout 300 npx playwright install chromium && exit 0
          exit 1
      - name: 預檢——面板起得來，而且不動使用者的檔案
        run: node tools/vscode-preflight/run.mjs

      # 🔴 **入口條件：產物真的長出來了，而且不是一個空殼。**
      #
      # `ship-extension` §2 逐字：「建置腳本裡的錯誤**可能不會讓指令失敗**
      # ——回頭確認產出物真的換了」。一個 0 位元組的 vsix 會讓下面每一步
      # 都「成功」，而使用者裝到的是空的。
      #
      # ⚠️ 錨在**大小與檔案數**（合成量），不錨在「有沒有壞掉」。
      - name: 產物體檢
        run: |
          set -euo pipefail
          VSIX=build/vscode/semorphe-vscode.vsix
          test -f "$VSIX" || { echo "::error::沒有產出 $VSIX"; exit 1; }
          SIZE=$(stat -c%s "$VSIX")
          FILES=$(unzip -l "$VSIX" | tail -1 | awk '{print $2}')
          echo "vsix ${SIZE} 位元組、${FILES} 個檔"
          # 目前約 1.4 MB／數十個檔；低於這個量級代表建置只跑了一半
          test "$SIZE" -gt 300000 || { echo "::error::vsix 只有 ${SIZE} 位元組——建置多半只跑了一半"; exit 1; }
          test "$FILES" -gt 10 || { echo "::error::vsix 只有 ${FILES} 個檔"; exit 1; }
          # 🔴 **面板的程式真的在裡面**——少了它擴充裝得起來而畫面是空的
          unzip -l "$VSIX" | grep -q 'webview' || { echo "::error::vsix 裡沒有 webview 的產物"; exit 1; }
          # 🔴 **網頁版的進入點也在裡面**（2026-09-10，使用者在 Codespaces 撞到）
          #
          #    少了它，vscode.dev／github.dev／瀏覽器裡的 Codespaces 只會說
          #    「command 'semorphe.openBlocks' not found」——而擴充看起來裝好了。
          #
          #    > 一個只宣告了 `main` 的擴充，在網頁版裡不是「壞掉」——
          #    > 它是【不存在】，而畫面上只看得到一句「找不到那個指令」。
          unzip -l "$VSIX" | grep -q 'extension.web.js' \
            || { echo "::error::vsix 裡沒有網頁版的進入點——網頁版的 VS Code 會說找不到指令"; exit 1; }

      - name: 版本
        id: ver
        run: |
          V=$(grep -oE "EXTENSION_VERSION = '[^']+'" src/vscode/manifest.ts | grep -oE "[0-9][^']*")
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "manifest 版本：$V"

      # 🔴 **tag 與 `EXTENSION_VERSION` 必須一致。**
      #
      # `ship-extension` §1：「換版本號——**不是可選的**。VSCode 以
      # `(id, version)` 為鍵快取 `contributes`；版本不變就不重建，
      # 而症狀是『改了而畫面沒變，且零錯誤』」。
      #
      # ⚠️ 而發佈時多一個風險：**tag 說 v0.11.0 而包裡是 0.10.4**
      # ——使用者以為裝到新版，實際上裝到舊的，而**沒有任何東西會出聲**。
      - name: tag 與版本要對得上
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAN="${{ steps.ver.outputs.value }}"
          [ "$TAG" = "$MAN" ] || {
            echo "::error::tag 是 v$TAG 而 manifest 是 $MAN——使用者會以為裝到新版而裝到舊的"
            exit 1
          }

      # 🔴 **給出去的檔名要帶版本**——而理由不是「比較好看」。
      #
      # Arduino IDE（Theia）的解壓快取**以資料夾名字為鍵**，而那個名字
      # 是從 vsix 的檔名來的。所以每一版都叫 `semorphe-vscode.vsix` 的話，
      # 使用者覆蓋掉舊檔 → 名字沒變 → **它不會重新解，而且不報錯**：
      # 面板照開，裡面是舊版。（`tools/install-ide.mjs` 的檔頭記著我們
      # 自己被這個坑過一次，差點拿四個版本以前的東西去測。）
      #
      # > **一個以名字為鍵的快取，只要讓版本進到名字裡就失效得掉。**
      #
      # ⚠️ 所以這不是包裝，是**把一個陷阱從使用者手上拿掉**
      #    ——否則 README 就得叫他們去刪一個看不見的資料夾。
      - name: 檔名帶上版本
        id: pkg
        run: |
          set -euo pipefail
          NAME="semorphe-vscode-${{ steps.ver.outputs.value }}.vsix"
          cp build/vscode/semorphe-vscode.vsix "build/vscode/$NAME"
          echo "path=build/vscode/$NAME" >> "$GITHUB_OUTPUT"
          echo "給出去的檔名：$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: semorphe-vscode-${{ steps.ver.outputs.value }}
          path: ${{ steps.pkg.outputs.path }}
          if-no-files-found: error

      # ── 發佈：只有 tag ────────────────────────────────────────────
      #
      # ⚠️ **GitHub Release 一定發**（不需要任何祕密）。
      #    Marketplace／Open VSX 只有在祕密存在時才發——而**跳過要出聲**，
      #    不是靜靜地不做（那會讓「我發佈了」變成一句沒有人驗證過的話）。
      # 🟢 **更版說明是寫給人讀的**（2026-11-05，使用者定）：有 `release-notes/<tag>.md` 就用它當內文（接上安裝說明），
      #    不再附自動產生的提交清單（一版三百多筆，沒有人讀）；沒有那個檔就照舊自動產生。
      - name: 組更版說明
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          F="release-notes/${GITHUB_REF_NAME}.md"
          {
            if [ -f "$F" ]; then cat "$F"; echo; fi
            cat <<'INSTALL'
          ## 安裝

          **VSCode**：擴充商店搜 **Semorphe**，或下載下面的 `.vsix` 後
          `code --install-extension semorphe-vscode-<版本>.vsix`

          **Arduino IDE**：把 `.vsix` 放進 `~/.arduinoIDE/plugins/` 再重開。
          ⚠️ 不是官方通道，換一版可能失效。

          完整步驟見 [README 的安裝章節](https://github.com/timcsy/semorphe#安裝)。
          INSTALL
          } | sed 's/^          //' > build/release-body.md
          if [ -f "$F" ]; then echo "curated=true" >> "$GITHUB_OUTPUT"; else echo "curated=false" >> "$GITHUB_OUTPUT"; echo "::notice::沒有 ${F}，Release 內文用自動產生的提交清單"; fi

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.path }}
          body_path: build/release-body.md
          generate_release_notes: ${{ steps.notes.outputs.curated != 'true' }}

      - name: 發到 Marketplace（有祕密才發）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice::沒有 VSCE_PAT，跳過 Marketplace。設了它之後 VSCode 才會自動更新。"
            exit 0
          fi
          npx -y @vscode/vsce publish --packagePath build/vscode/semorphe-vscode.vsix --pat "$VSCE_PAT"

      - name: 發到 Open VSX（有祕密才發）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::notice::沒有 OVSX_PAT，跳過 Open VSX（VSCodium／Theia 那一族的市集）。"
            exit 0
          fi
          npx -y ovsx publish build/vscode/semorphe-vscode.vsix -p "$OVSX_PAT"
