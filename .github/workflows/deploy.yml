name: Deploy to GitHub Pages

# 🔴 **PR 也要跑，而這一格 2026-08-19 才補。**
#
# 在那之前 CI **只在 push 到 main 時跑**，於是 PR #2 那 84 個 commit
# **合併之前從來沒跑過 e2e**——`monacoPanel` 被改名成 `codeView`
# （spec 140），而 e2e 五個檔、26 處還在等舊名字。
#
# 症狀：合併當天 e2e 19/28 紅，**而它紅了一整天沒有人看**
# ——包括之後好幾次推送。
#
# > **一個只在【合併之後】才跑的檢查，擋不住任何東西
# > ——它只負責在事後告訴你已經來不及了。**
#
# ⚠️ `build`／`deploy` 仍然只在 main 跑（見它們的 `if`）：
# PR 要的是**驗證**，不是發布。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ⚠️ **這個 job 是 2026-08-08 才加的，而在那之前 CI 一行測試都沒跑。**
  #
  # 當時的狀態：22 條護欄、226 個測試檔、3633 個測試——**而自動執行它們的
  # 機制是零**。它們只在有人手動打 `npm test` 時跑。
  #
  # 那正是這個專案的核心信條打在自己身上（`knowledge/concepts/執行機構.md`）：
  #
  #   「一條規範沒有機械化的檢查，它本身就是殼——而殼看起來像完成。」
  #
  # 檢查有了，而沒有機械化的東西去跑那些檢查。這是「機制有了，沒人接上」
  # 的**第七個實例**，也是最大的一個：前六個各漏掉一個機制，這個漏掉的是全部。
  test:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ **要完整歷史**（`fetch-depth: 0`）。
      #
      # CI 接上的第一次執行就被這件事擋下來：`syntax-tokens.test.ts` 用
      # `git show 35e96d8:…` 去讀 059 動工**之前**的核心檔——那是
      # `build-guardrail` 第 6 步要求的「已知答案的樣本」，用當時確實有問題的
      # 真實程式碼驗判準抓不抓得到。
      #
      # 而 `actions/checkout` 預設是淺複製（depth 1），那個 commit 在 CI 裡不存在：
      #
      #   fatal: invalid object name '35e96d8'.
      #
      # 這是**只在本機通得過**的測試——完整複製才看得到。它也正好說明了為什麼
      # 要接 CI：測試在誰的機器上跑得過，與它是不是真的在跑，是兩件事。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      # ⚠️ **護欄的基線不得在 CI 裡被重新產生。**
      #
      # `GENERATE_BASELINE=1` 會把當下的狀態封為合格。如果 CI 跑完之後基線檔
      # 有改動，代表有人（或某支測試）在刷分數——那會讓棘輪失去意義，
      # 而且它是**靜默的**：測試照樣綠。
      #
      # 見 `knowledge/history/018`（用宣告刷數字）。
      - name: 基線與清冊不得被改動
        run: |
          if ! git diff --exit-code --stat tests/baselines tests/assets; then
            echo "::error::測試執行後基線／清冊被改動了——那是在刷分數，不是通過。"
            exit 1
          fi

  # ⚠️ **這個 job 補的是「沒有任何自動化在看渲染出來的結果」那一格**
  # （`knowledge/vision.md`「執行機構自己接上」那一節的未承諾項）。
  #
  # 它的代價在 2026-08-12 被量了出來：`execution:at-node` 與斷點反轉做完之後，
  # **有兩件事驗不到**——斷點「命中時會停」與加速功能。那不是懶得測，
  # 是**用截圖與座標點擊去驗 UI 本來就會這樣**：同一個座標時中時不中，
  # 而 toggle 兩次等於沒設，**畫面上看不出差別**。
  #
  # 接上之後第一件事就是抓到一個錯誤假設：我以為「停住 ＝ 還沒印出 6」，
  # 而除錯模式是**先跑完再回放**——輸出與執行位置是兩個時間軸。
  # 那個假設在單元測試裡永遠不會被否證，因為那裡沒有「主控台」。
  # ## 🔴 分片（2026-09-14）——而它**不違反** `playwright.config.ts` 的 `workers: 1`
  #
  # 那一行的理由是量出來的，逐字：「4 個 Chromium ×（Blockly ＋ tree-sitter wasm
  # ＋ 177 顆膠囊）擠 4 個效能核，每次開機慢 3～4 倍——而這些測試用固定秒數等待，
  # 那是照閒置機器校準的。」
  #
  # 🟢 **那是【同一台機器上開四個 worker】，這裡是【四台機器各開一個】**
  # ——每一片仍然 `workers: 1`，不搶核，那條理由碰不到分片。
  #
  # ⚠️ **而不要期待四倍**：`fullyParallel: false` 之下 Playwright 以【檔】為單位
  # 分片，而 `lessons.spec.ts` 一支就佔 14.4 分鐘（全長 26.3 分）。
  # 所以下限是那一支，預期落在 **15 分鐘左右**，不是 7 分。
  #
  # > **一個分片的加速上限，是它最大的那一塊——而不是片數。**
  #
  # 🔴 要再往下，得先把 `lessons.spec.ts` 拆開（69 課全部產在同一個檔裡）
  # ——那是另一刀，而在拿到這一刀的實測數字之前不要先做。
  e2e:
    runs-on: ubuntu-latest
    strategy:
      # ⚠️ **不要 fail-fast**：一片紅就砍掉其他三片的話，你只會看到第一個
      #    失敗，而修完它才知道還有第二個——那把一輪 15 分鐘變成三輪。
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # ⚠️ 只裝 chromium。裝全部瀏覽器要多幾分鐘，而這批測試量的是
      # 「渲染出來對不對」，不是跨瀏覽器相容性——那是另一個問題，
      # 要問的時候再加，不要因為「順便」而讓每次 CI 都變慢。
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # ⚠️ 名字要帶片號——四片同名的話 upload-artifact v4 會直接失敗，
          #    而那個錯誤訊息出現在【測試已經紅了】的下面，很容易被讀成同一件事。
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  build:
    # 🔴 **什麼都不等**（2026-09-14 第二刀）——快車道的全部意義就在這一行。
    #
    # 第一版寫的是 `needs: [test]`，而那是半套：快車道的契約明寫著「沒驗過」，
    # 卻讓它等一個 7.2 分鐘的閘門。
    #
    # ## ⚠️ 而 `test` 對【快車道】其實幾乎沒有保護
    #
    # ```
    # build（65 秒）  擋得住  壞的 import、語法錯、型別錯（`"build": "tsc && vite build"`）
    # test（432 秒）  多擋    行為迴歸、對照圖過期、基線被改
    # ```
    #
    # 第二排那些驗的是「這個 repo 的形狀」，而快車道壞掉的方式是「畫面打不開」
    # ——**那是 `build` 會擋的**。
    #
    # 🟢 而主線一格都沒鬆：`promote` 仍然 `needs: [test, e2e]`，
    #    `/` 取的仍然是 `verified`。**build 失敗的話兩邊都不動**，上一版還在。
    #
    # > **一條明講「沒驗過」的線，如果還要等一個閘門，
    # > 那它買到的不是安全，是把兩件事都做得半吊子。**
    needs: []
    # ⚠️ 只有 main 才發布——PR 跑到 `test`／`e2e` 就夠了。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # 🔴 **這裡也要完整歷史**（2026-09-03）：`sitemap.xml` 的 `lastmod` 問的是
      #    `git log`，而淺複製裡 HEAD **沒有父節點** → git 把它當根 commit →
      #    「所有檔案都是今天新增的」→ 66 筆 lastmod 全部變成部署日。
      #
      #    ⚠️ 而 `test` job 有 `fetch-depth: 0`，所以**護欄在有歷史的那一份上跑，
      #    是綠的**——出貨的卻是另一次 checkout。
      #
      # > **護欄跑的那一份，與出貨的那一份，不是同一次 checkout。**
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 🔴 **兩份站合成一包**（2026-09-14）——見 `tools/build-site.sh` 的檔頭。
      #
      # ```
      # /        主線     ＝ verified 分支（最後一次 e2e 綠的那一版）
      # /next/   快車道   ＝ 這個 commit（沒有驗過）
      # ```
      #
      # ⚠️ **這個 job 只 `needs: [test]`**——快車道的意義就在它不等 e2e。
      #    而主線不會因此變不安全：它取的是 `verified`，不是 HEAD。
      - run: git fetch origin verified:verified --force || echo "::notice::還沒有 verified 分支"
      # 主線 = verified（最後一次 e2e 綠的）· 快車道 = 這個 commit
      - run: bash tools/build-site.sh verified HEAD
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ## 🟢 e2e 綠了，才把「主線該用哪一版」往前推
  #
  # 🔴 **它是一個 ref，不是一次部署**——推完之後**下一次 build** 才會把主線換過去。
  # 而那「下一次」通常就是這一輪：`promote` 之後 `build` 會被重新觸發？**不會。**
  # 所以這裡自己再跑一次 build＋deploy（下面的 `redeploy`）。
  #
  # > **一個「等它下次再說」的更新，在沒有下次的那個 commit 上永遠不會發生
  # > ——而那個 commit 正好是你最想看到它上線的那一個。**
  promote:
    needs: [test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: verified ← 這一版（它跑完了整套 e2e）
        run: |
          git push origin "HEAD:refs/heads/verified" --force
          echo "::notice::verified 推到 $(git rev-parse --short HEAD)——主線下一次部署會換成它"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ## 主線的第二次部署——`verified` 往前推了之後
  #
  # ⚠️ 兩次部署會被 `concurrency: pages` 排隊（`cancel-in-progress: false`），
  #    所以這一次一定跑在第一次之後。快車道那一份內容相同，重畫沒有副作用。
  #
  # 🔴 **而它是整條路上唯一一個「主線真的換版」的地方**——
  #    前面那次部署的 `/` 是上一版。
  redeploy:
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 🔴 **快車道取的是 `origin/main`，不是這個 commit**（2026-09-14）。
      #
      #    這一步跑在 e2e 之後（十幾分鐘），而那段時間裡可能又推了一次。
      #    用自己的 commit 建 `/next/` 會**把後來那一版蓋回去**，
      #    而症狀是「我明明改好了，過幾分鐘它又變回去」——課堂上最難解釋的一種。
      #
      # > **一條分兩次部署的路，第二次帶著的是【它出發時的世界】
      # > ——而世界在它跑的那幾分鐘裡動過了。**
      - run: git fetch origin main --force
      - run: bash tools/build-site.sh HEAD origin/main
      # 🔴 **產物要換個名字**（2026-09-14）。
      #
      #    `upload-pages-artifact` 預設一律叫 `github-pages`，而這一輪**上傳兩次**
      #    （快車道一次、主線換版一次）。同名的兩份在同一個 workflow run 裡，
      #    `deploy-pages` 直接拒絕：
      #
      #    > Multiple artifacts named "github-pages" were unexpectedly found
      #    > for this workflow run. Artifact count is 2.
      #
      # ⚠️ 而它紅在**最後一步**：前面 test／e2e／build／deploy／promote 全綠，
      #    快車道也真的上線了——只有「主線換版」沒發生。
      #
      # > **一條分成兩次部署的路，它的第二次會踩到第一次留下的東西
      # > ——而那個東西有一個寫死的預設名字。**
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-promoted
          path: dist

  redeploy-pages:
    needs: redeploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # ⚠️ 要與上面那個 `name` 逐字相同——寫錯的症狀是「找不到產物」，
          #    而它同樣紅在最後一步。
          artifact_name: github-pages-promoted
